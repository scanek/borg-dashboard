services:
  borg-dashboard:
    build: .
    image: borg-dashboard:latest
    container_name: borg-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Moscow
      - BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=yes
      - BORG_RELOCATED_REPO_ACCESS_IS_OK=yes
      - BORG_CACHE_DIR=/tmp/borg_cache
      - BORG_REPOS_HOST_PATH=${BORG_REPOS_HOST_PATH:-}
      - BORG_REPO_1_HOST_PATH=${BORG_REPO_1_HOST_PATH:-}
      - BORG_REPO_2_HOST_PATH=${BORG_REPO_2_HOST_PATH:-}
      # Опционально: можно переопределить имена и источники
      # - BORG_REPO_1_NAME=Docker & Контейнеры
      # - BORG_REPO_1_SOURCE=/volume1/docker
      # - BORG_REPO_2_NAME=Immich Фото & База
      # - BORG_REPO_2_SOURCE=/volume1/immich
    volumes:
      # Путь к локальным репозиториям Borg на хосте (настраивается через .env)
      # (Borg требует право на запись для временных lock-файлов при чтении)
      - ${BORG_REPOS_HOST_PATH:-/srv/dev-disk-by-uuid-YOUR-DISK-UUID}:/repos
      # Каталог с логами бэкапов (read-only, настраивается в .env)
      - ${BORG_LOGS_DIR:-/volume1/logs}:/logs:ro
      # Руководство по восстановлению (read-only, встроенное по умолчанию или кастомное из .env)
      - ${BORG_GUIDE_PATH:-./app/docs/RECOVERY.md}:/app/docs/RECOVERY.md:ro
      # Доступ к дискам хоста для проводника и резервного копирования (read-only)
      # При необходимости добавьте или измените точки монтирования под ваш сервер (/mnt, /home, /data)
      - /srv:/srv:ro
      - /volume1:/volume1:ro
      # Сохранение кэша метаданных и конфигураций задач между перезапусками
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
